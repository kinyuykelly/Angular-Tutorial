    <div class="col-12 m-3">
        <b>Example of *ngIf vs "a if " </b>
    </div>
    <div class="row text-center">
        <div class="col-4">
            <div (click)="onClick()">
                <input type="checkbox" name="" id=""> Terms & Conditions
            </div>
            <!-- <div *ngIf="isChecked">
        <button class="btn btn-success">Submit</button>
    </div> -->
            @if (isChecked) {
            <button class="btn btn-success">Submit</button>
            }
        </div>
    </div>
    <div>
        <!-- <div>
            <input type="text" value="Hi Kelly" *ngIf="isInputBox">
        </div> -->
        @if(isInputBox){
        <input type="text" value="Hi Kelly" *ngIf="isInputBox">
        }
        <div class="">

            <button class="btn btn-danger" (click)="hideField()">Hide</button>
        </div>
    </div>
</div>
<div class="m-5 col">

        <input type="text" [(ngModel)]="input1">
    </div>
    <div>
        <input type="text" [(ngModel)]="input2">
    </div>

    <div *ngIf="input1 !== input2">

    <div *ngIf="input1 === input2">
        <h4>
            Both values are eqaul
        </h4>
    </div> -->
    @if(input1 === input2){
    <h4>
        Both values are eqaul
    </h4>
    }
    @else if (input1 !== input2) {
    Both values are not eqaul
